<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="hero">
  <defs>
    <radialGradient id="glow-hero" cx="62%" cy="34%" r="72%">
      <stop offset="0%"  stop-color="#c8a558" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#c8a558" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#0d0a07" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vig-hero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#000" stop-opacity="0.42"/>
      <stop offset="45%"  stop-color="#000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.62"/>
    </linearGradient>
    <filter id="grain-hero" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="62"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="#0d0a07"/>
  <rect width="1200" height="900" fill="url(#glow-hero)"/>
  <g opacity="0.10" fill="none" stroke="#c8a558" stroke-width="2">
    <path d="M180 900 V420 a120 120 0 0 1 240 0 V900"/>
    <path d="M480 900 V360 a150 150 0 0 1 300 0 V900"/>
    <path d="M840 900 V450 a110 110 0 0 1 220 0 V900"/>
  </g>
  <rect width="1200" height="900" fill="url(#vig-hero)"/>
  <rect width="1200" height="900" filter="url(#grain-hero)" opacity="0.55"/>
</svg>
