# Checks for the TRUST application in trust/. Runs only when that folder changes.
name: TRUST checks

on:
  push:
    branches: ["main", "claude/orchestrater-cyber-offensive-4do8x6"]
    paths: ["trust/**", ".github/workflows/trust-ci.yml"]
  pull_request:
    paths: ["trust/**", ".github/workflows/trust-ci.yml"]

permissions:
  contents: read

concurrency:
  group: trust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trust
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trust/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Runs the real migrations on a throwaway Postgres and tries to break
      # tenant isolation and the workflow rules.
      - name: Database security tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql postgresql-client
          npm run test:db

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
