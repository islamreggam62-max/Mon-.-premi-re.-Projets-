    </filter>
  </defs>

  <ellipse cx="260" cy="576" rx="132" ry="22" fill="#0d2a30" opacity="0.16" filter="url(#soft)"/>

  <!-- الجسم -->
  <path d="M148 250 a112 112 0 0 1 224 0 v238 a56 56 0 0 1 -56 56 h-112 a56 56 0 0 1 -56 -56 z" fill="url(#bodyH)"/>
