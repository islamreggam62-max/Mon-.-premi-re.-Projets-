  <ellipse cx="260" cy="193" rx="21" ry="7" fill="#0f1417"/>
  <g stroke="#9aa4ac" stroke-width="2.5" opacity="0.85">
    <line x1="245" y1="193" x2="275" y2="193"/>
    <line x1="252" y1="189" x2="268" y2="197"/>
    <line x1="252" y1="197" x2="268" y2="189"/>
  </g>
  <!-- لمعة جانبية -->
  <rect x="196" y="286" width="26" height="212" rx="13" fill="#ffffff" opacity="0.17"/>
  <!-- الشعار -->
  <circle cx="260" cy="372" r="27" fill="#ffffff" opacity="0.9"/>
  <path d="M266 356 l-16 21 h11 l-5 19 16 -22 h-11 z" fill="#1d6270"/>
