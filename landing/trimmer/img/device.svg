<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" width="520" height="620" role="img" aria-label="ماكينة تشذيب شعر الأنف والأذن">
  <defs>
    <linearGradient id="bodyG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d6270"/><stop offset="38%" stop-color="#3d8b98"/>
      <stop offset="62%" stop-color="#2d7683"/><stop offset="100%" stop-color="#174e5a"/>
    </linearGradient>
    <linearGradient id="bodyH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#17505c"/><stop offset="30%" stop-color="#41919e"/>
      <stop offset="55%" stop-color="#2f7683"/><stop offset="100%" stop-color="#14454f"/>
    </linearGradient>
    <linearGradient id="capG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#20262b"/><stop offset="35%" stop-color="#4a555d"/>
      <stop offset="65%" stop-color="#2b333a"/><stop offset="100%" stop-color="#171c20"/>
    </linearGradient>
    <radialGradient id="ledG" cx="50%" cy="50%" r="50%">
