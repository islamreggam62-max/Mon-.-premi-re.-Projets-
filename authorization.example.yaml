# ---------------------------------------------------------------------------
# ملف الأذونات  --  انسخه إلى authorization.yaml ثم املأه.
#
# لن يعمل المنسّق ضد أي هدف غير مذكور هنا.
# اذكر فقط المضيفين الذين تملكهم أو لديك تصريح كتابي باختبارهم.
# ---------------------------------------------------------------------------

operator: "اسمك"
engagement: "تدريب في المختبر المنزلي"   # وصف لهذه المهمّة / الجولة

# اضبطه على true فقط إن كان لديك تصريح باختبار كل مضيف في 'scope'.
# هذا إقرار. تركه false (أو غيابه) يرفض كل تشغيل.
i_am_authorized: false

# انتهاء صلاحية اختياري (تاريخ ISO). بعد هذا التاريخ تُرفَض عمليات التشغيل.
# expires: "2026-12-31"

# افتراضيًا تُقبل الأهداف المحلية / الخاصة / المحلية للوصلة فقط، بحيث لا يمكن
# لأي تشغيل جاهز أن يصل إلى الإنترنت العام. اجعله true فقط لمهمّة غير محلية
# مُصرَّح بها فعلاً.
allow_nonlocal: false

# قائمة سماح للأهداف القابلة للفحص: عناوين IP مجرّدة، أو نطاقات CIDR، أو أسماء مضيفين.
scope:
  - 127.0.0.1
  - 192.168.56.0/24     # مثال: شبكة مختبر خاصة معزولة (host-only)
